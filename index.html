/* ---------------------------------------------------------

function calcStreak(doses) {
  const daily = doses.filter((d) => d.mode === "daily");
  if (daily.length === 0) return 0;

  const last = Math.max(...daily.map((d) => d.timestamp));

  return streak;
}
function dailyStatus(doses) {
  const daily = doses.filter((d) => d.mode === "daily");
  if (daily.length === 0) return { level: "gap", title: "Let's get started", detail: "Log your first dose to kick off your streak." };
  const last = Math.max(...daily.map((d) => d.timestamp));
  const h = hoursSince(last), streak = calcStreak(doses);
  if (h > 48) return { level: "gap", title: "Streak broken", detail: "Last dose " + fmtRelative(last) + ". Time to jump back in — grab a barrier method until you're back on track." };
  if (h > 24) return { level: "due", title: "Dose o'clock", detail: "Last dose " + fmtRelative(last) + ". Keep the streak alive — log today's dose." };
  if (streak < 7) return { level: "building", title: "Building momentum", detail: "Day " + streak + " of your streak. Full protection kicks in around day 7 of steady, daily dosing." };
  return { level: "protected", title: "Fully powered up", detail: "Last dose " + fmtRelative(last) + ". Streak: " + streak + " days strong." };
}

  if (loads.length === 0) return { level: "gap", title: "No loading dose yet", detail: "Take 2 pills 2–24h before sex, then log it here." };
  const load = loads.sort((a, b) => b.timestamp - a.timestamp)[0];
  const h = hoursSince(load.timestamp);
  const follow1 = follows.find((f) => f.timestamp - load.timestamp >= 18 * HOUR && f.timestamp - load.timestamp <= 30 * HOUR);
  const follow2 = follows.find((f) => f.timestamp - load.timestamp >= 42 * HOUR && f.timestamp - load.timestamp <= 54 * HOUR);
  if (h < 2) return { level: "due", title: "Warming up", detail: "Loading dose taken " + fmtRelative(load.timestamp) + ". Coverage kicks in around the 2-hour mark." };
  if (h <= 24) return { level: "protected", title: "Covered", detail: follow1 ? "Covered for now. First follow-up dose logged." : "Covered for now. Take your first follow-up dose 24h after the loading dose (around " + fmtDateTime(load.timestamp + 24 * HOUR) + ")." };

  if (h <= 48) {
    if (!follow1) return { level: "gap", title: "Missed a beat", detail: "The 24h follow-up window has passed. Grab a barrier method and talk to your provider." };
    return { level: "protected", title: "Covered", detail: follow2 ? "Second follow-up dose logged. Regimen complete." : "Take your second follow-up dose 48h after the loading dose (around " + fmtDateTime(load.timestamp + 48 * HOUR) + ")." };
  }
  if (h <= 54 && follow1 && !follow2) return { level: "due", title: "Last stretch", detail: "It's been " + Math.round(h) + "h since your loading dose. Take your final pill to complete the regimen." };
  if (follow1 && follow2) return { level: "protected", title: "Regimen complete", detail: "Loading dose " + fmtRelative(load.timestamp) + ". Both follow-up doses logged." };

async function fetchAllEncrypted(userId, key) {
  const settingsRes = await sb.from("settings_enc").select("*").eq("user_id", userId).maybeSingle();
  const doseRes = await sb.from("doses_enc").select("*").eq("user_id", userId).order("created_at", { ascending: false });
  const encRes = await sb.from("encounters_enc").select("*").eq("user_id", userId).order("created_at", { ascending: false });
  const settings = settingsRes.data ? await decryptJSON(key, settingsRes.data.ct, settingsRes.data.iv) : { prepMode: "daily", pinEnabled: false, pin: "", lastLabDate: null };
  const doses = await Promise.all((doseRes.data || []).map(async function (r) { const d = await decryptJSON(key, r.ct, r.iv); return Object.assign({ id: r.id }, d); }));
  const encounters = await Promise.all((encRes.data || []).map(async function (r) { const d = await decryptJSON(key, r.ct, r.iv); return Object.assign({ id: r.id }, d); }));
  return { settings: settings, doses: doses, encounters: encounters };
}

function App() {
  const [session, setSession] = useState(undefined);
  const [vaultStage, setVaultStage] = useState("checking");
  const [vaultKey, setVaultKey] = useState(null);
  const [vaultError, setVaultError] = useState("");
  const [vaultBusy, setVaultBusy] = useState(false);

  useEffect(function () {
    sb.auth.getSession().then(function (r) { setSession(r.data.session); });
    const sub = sb.auth.onAuthStateChange(function (_e, sess) { setSession(sess); setVaultKey(null); setVaultStage("checking"); });
    return function () { sub.data.subscription.unsubscribe(); };
  }, []);

  useEffect(function () {
    if (!session) return;
    (async function () {
      const r = await sb.from("key_material").select("*").eq("user_id", session.user.id).maybeSingle();
      setVaultStage(r.data ? "unlock" : "setup");
    })();
  }, [session]);

  const createVault = async function (passphrase) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const saltB64 = bufToB64(salt);
    const key = await deriveKey(passphrase, saltB64);
    const check = await encryptJSON(key, { ok: true });
    const r = await sb.from("key_material").insert({ user_id: session.user.id, salt: saltB64, check_ct: check.ct, check_iv: check.iv });
    if (r.error) throw r.error;
    setVaultKey(key); setVaultStage("ready");
  };

  const unlockVault = async function (passphrase) {
    setVaultBusy(true); setVaultError("");
    try {
      const r = await sb.from("key_material").select("*").eq("user_id", session.user.id).maybeSingle();
      const key = await deriveKey(passphrase, r.data.salt);
      const check = await decryptJSON(key, r.data.check_ct, r.data.check_iv);
      if (check && check.ok) { setVaultKey(key); setVaultStage("ready"); } else setVaultError("bad");
    } catch (e) { setVaultError("bad"); } finally { setVaultBusy(false); }
  };

  if (session === undefined || (session && vaultStage === "checking")) return React.createElement("div", { style: { display: "flex", alignItems: "center", justifyContent: "center", minHeight: "100vh", background: C.ink } }, React.createElement("div", { style: { color: "rgba(255,255,255,0.6)", fontSize: 14, fontWeight: 600 } }, "Loading…"));
  if (!session) return React.createElement(AuthScreen, null);
  if (vaultStage === "setup") return React.createElement(VaultSetupScreen, { onCreated: createVault });
  if (vaultStage === "unlock") return React.createElement(VaultUnlockScreen, { onUnlock: unlockVault, error: vaultError, busy: vaultBusy });
  return React.createElement(Dashboard, { userId: session.user.id, vaultKey: vaultKey, onSignOut: function () { sb.auth.signOut(); } });
}
